networks:
  web:
    external: true
  gitea:
    external: false

services:
  gitea:
    image: gitea/gitea:1.21.7
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    networks:
      - gitea
      - web
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8888:3000"
      - "2221:22"
    labels:
      traefik.enable: true
      traefik.http.routers.gitea.entryPoints: https
      traefik.http.services.gitea.loadbalancer.server.port: 3000
      traefik.http.routers.gitea.middlewares: secured@file
