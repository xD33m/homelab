global:
    checkNewVersion: false
    sendAnonymousUsage: false

# Performance: ServersTransport optimizations
serversTransport:
    insecureSkipVerify: true
    maxIdleConnsPerHost: 200

experimental:
    plugins:
        traefik-oidc-auth:
            moduleName: "github.com/sevensolutions/traefik-oidc-auth"
            version: "v0.17.0"
        bouncer:
            moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            version: "v1.5.0"

# Enable traefik ui dashboard
api:
    dashboard: true
    # Disable insecure API mode - must use traefik labels
    insecure: false

# Enable ping for healthcheck
ping:
    # Only allow ping from internal network
    entryPoint: traefik

# Log level INFO|DEBUG|ERROR
log:
    level: INFO
    filePath: "/var/log/traefik/traefik.log"
    format: json

accessLog:
    filePath: "/var/log/traefik/access.log"
    format: json
    bufferingSize: 100  # Buffer for better performance
    fields:
        defaultMode: keep
        headers:
            defaultMode: drop  # Drop all headers by default for security
            names:
                # Essential for CrowdSec detection
                User-Agent: keep         # Bad bot/scanner detection
                X-Forwarded-For: keep    # Real client IP (Cloudflare)
                X-Real-Ip: keep          # Alternative real IP header
                Referer: keep            # CSRF/referrer spam detection
                # Useful for attack pattern detection
                Content-Type: keep       # Payload type detection
                Content-Length: keep     # Large payload detection
                Accept: keep             # Protocol abuse detection
                Accept-Language: keep    # Bot fingerprinting (bots often omit)
                Accept-Encoding: keep    # Compression bomb detection
                Host: keep               # Host header attacks
                # Security headers CrowdSec may analyze
                X-Forwarded-Proto: keep  # Protocol downgrade attacks
                X-Forwarded-Host: keep   # Host spoofing detection
    # Note: No filters applied to ensure CrowdSec sees all requests
    # CrowdSec needs to see fast/malicious requests for proper detection

entryPoints:
    http:
        address: :80
        # Transport layer optimizations
        transport:
            lifeCycle:
                requestAcceptGraceTimeout: 5s
                graceTimeOut: 10s
            respondingTimeouts:
                readTimeout: 30s
                writeTimeout: 30s
                idleTimeout: 180s
        forwardedHeaders:
            trustedIPs: &trustedIps
                # Start of Cloudflare public IP list for HTTP requests (updated Dec 2024)
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
                # IPv6 ranges
                - 2400:cb00::/32
                - 2606:4700::/32
                - 2803:f800::/32
                - 2405:b500::/32
                - 2405:8100::/32
                - 2a06:98c0::/29
                - 2c0f:f248::/32
                # End of Cloudflare public IP list
                # Trust the Tunnel Container (Local Docker Network)
                - 172.16.0.0/12
                - 10.0.0.0/8
        http:
            redirections:
                entryPoint:
                    to: https
                    scheme: https
                    permanent: true

    https:
        address: :443
        # HTTP/3 is automatically enabled when experimental.http3 is true
        # Note: HTTP/3 QUIC will be advertised via Alt-Svc header
        # Transport layer optimizations
        transport:
            lifeCycle:
                requestAcceptGraceTimeout: 5s
                graceTimeOut: 10s
            respondingTimeouts:
                readTimeout: 60s
                writeTimeout: 60s
                idleTimeout: 180s
        forwardedHeaders:
            trustedIPs: *trustedIps
        http:
            tls:
                # Generate a wildcard domain certificate
                certResolver: dns-cloudflare
                domains:
                    - main: lucask.dev
                      sans:
                          - '*.lucask.dev'
                    - main: example.org
                      sans:
                          - '*.example.org'
                # Note: Do NOT specify tls options here - it causes 421 errors
                # because the file provider hasn't loaded yet at static config time
                # TLS 1.3 is used by default in Traefik 3.x
            # NOTE: Do NOT add global middlewares here - they conflict with
            # per-router middleware chains (double rate-limiting, header conflicts).
            # Each router specifies its own chain (secured, secured-relaxed, etc.)
            # which already includes rate-limit, security headers, compress, and crowdsec.

    # Tailnet-only entrypoint. Published on the host as TCP 443 (see
    # docker-compose.yml) and reached directly by tailscale clients, so it never
    # sees Cloudflare tunnel traffic - the tunnel talks to `https` over the docker
    # network instead. Routers must opt in with entrypoints=tailnet; every other
    # router in this stack pins `https`, so nothing lands here by accident.
    #
    # No forwardedHeaders.trustedIPs here ON PURPOSE: nothing sits in front of
    # this entrypoint, so X-Forwarded-For must stay untrusted or a forged header
    # could walk straight through the tailnet-only ipAllowList.
    tailnet:
        address: :8443
        transport:
            lifeCycle:
                requestAcceptGraceTimeout: 5s
                graceTimeOut: 10s
            respondingTimeouts:
                readTimeout: 60s
                writeTimeout: 60s
                idleTimeout: 180s
        http:
            tls:
                # Same wildcard cert as `https` - already in acme.json, and the
                # DNS-01 challenge does not care that the A record is a private
                # CGNAT address.
                certResolver: dns-cloudflare
                domains:
                    - main: lucask.dev
                      sans:
                          - '*.lucask.dev'

    # Internal entrypoint for ping/healthcheck (not exposed externally)
    traefik:
        address: :8082

providers:
    providersThrottleDuration: 2s
    file:
        directory: conf.d
        watch: true

    docker:
        endpoint: "tcp://docker-socket-proxy:2375"
        watch: true
        network: web
        defaultRule: 'Host(`{{ index .Labels "com.docker.compose.service"}}.lucask.dev`)'
        # swarmModeRefreshSeconds: 15s
        exposedByDefault: false

# Prometheus metrics for monitoring
metrics:
    prometheus:
        entryPoint: traefik
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        buckets:
            - 0.1
            - 0.3
            - 1.2
            - 5.0

certificatesResolvers:
    dns-cloudflare:
        acme:
            email: acme@example.com  # placeholder - real address redacted
            storage: /acme.json
            dnsChallenge:
                provider: cloudflare
                resolvers:
                    - '1.1.1.1:53'
                    - '1.0.0.1:53'
