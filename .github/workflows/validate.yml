name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show Docker Compose version
        run: docker compose version
      - name: Validate every stack with its .env.example
        run: ./scripts/validate-compose.sh

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: python3 -m pip install --user yamllint==1.38.0
      - name: Lint YAML
        run: python3 -m yamllint --format github .
